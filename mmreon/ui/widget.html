<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MMReon · виджет</title>
<link rel="stylesheet" href="common.css">
<script src="ranks.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; user-select: none; background: var(--night); }
  .w { position: relative; height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px;
       border: 1px solid var(--bronze-dim); border-radius: 12px;
       background: linear-gradient(90deg, color-mix(in srgb, var(--tier, #C9A36A) 14%, #171A23), #171A23 60%); }
  .w.wait { border-color: #6A5426; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .name { font-family: var(--display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .num { color: var(--text-2); font-weight: 400; margin-left: 6px; }
  .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .val { font-family: var(--display); font-stretch: condensed; font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="w" id="w" title="Двойной клик открывает MMReon">
  <div class="info"><div class="name">MMReon</div><div class="sub">Загрузка…</div></div>
</div>
<script>
let last = "", lastState = null;

function render(s) {
  lastState = s;
  const w = document.getElementById("w"), se = s.session;
  const pending = se.pending > 0;
  const icon = s.medal ? medalHTML(s.medal, 46) : "";
  if (s.medal) w.style.setProperty("--tier", TIER_COLORS[s.medal.index]);
  const name = s.medal ? `${esc(s.medal.name)}<span class="num">${s.rating.value.toLocaleString("ru-RU")}</span>` : "Рейтинг не прочитан";
  let sub, val = "";
  if (!s.rating) {
    sub = '<span class="est">Откройте «Профиль → История»</span>';
  } else if (pending) {
    sub = '<span class="est">Откройте «Историю»</span>';
    val = `<div class="val est">≈${sign(se.delta + se.estimate)}</div>`;
  } else {
    sub = se.items.length ? `Сессия: <span class="win">${se.wins}</span> – <span class="loss">${se.losses}</span>` : "Новая сессия";
    val = se.items.length ? `<div class="val ${tone(se.delta)}">${sign(se.delta)}</div>` : "";
  }
  w.className = "w" + (pending || !s.rating ? " wait" : "");
  w.innerHTML = `${icon}<div class="info"><div class="name">${name}</div><div class="sub">${sub}</div></div>${val}`;
}
function onMedalIconsBroken() { if (lastState) render(lastState); }

async function tick() {
  try {
    const s = await pywebview.api.get_state();
    const json = JSON.stringify([s.rating, s.medal, s.session.wins, s.session.losses, s.session.delta, s.session.estimate, s.session.pending]);
    if (json !== last) { last = json; render(s); }
  } catch (e) { console.error(e); }
}

document.addEventListener("dblclick", () => pywebview.api.show_main());
let started = false;
function init() {
  if (started) return;
  started = true;
  tick();
  setInterval(tick, 1500);
}
window.addEventListener("pywebviewready", init);
if (window.pywebview && window.pywebview.api) init();
</script>
</body>
</html>
