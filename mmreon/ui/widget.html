<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MMReon · виджет</title>
<link rel="stylesheet" href="common.css">
<script src="ranks.js"></script>
<style>
  /* Вёрстка рассчитана на высоту 74 px (панель профиля Доты при 1080p);
     под реальный размер окна виджет масштабируется целиком через zoom. */
  html, body { height: 100%; overflow: hidden; user-select: none; background: var(--night); }
  body { cursor: default; }
  .w { height: 100%; display: grid; grid-template-columns: 62px minmax(0, 1fr) auto auto; align-items: center;
       column-gap: 10px; padding: 0 12px 0 6px; border: 1px solid #3A3226;
       background: linear-gradient(90deg, color-mix(in srgb, var(--tier, #C9A36A) 16%, #161A22), #161A22 55%); }
  .w.wait { border-color: #6A5426; }
  .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .name { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.1;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tier, var(--text)); }
  .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub .num { color: var(--text-2); font-size: 13px; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .stat .v { font-family: var(--display); font-stretch: condensed; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .score .v { font-size: 22px; }
  .score .dash { color: var(--muted); margin: 0 2px; }
  .delta { min-width: 66px; }
  .delta .v { font-size: 30px; }
  .ph { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; justify-self: center;
        background: var(--stone-2); border: 2px solid var(--bronze-dim); color: var(--muted);
        font-family: var(--display); font-weight: 700; font-size: 20px; }
</style>
</head>
<body>
<div class="w" id="w"></div>
<script>
let last = "", lastState = null;

// Высота окна → масштаб: всё помещается так же, как в эталонных 74 px.
function fit() {
  const z = window.innerHeight / 74;
  if (z > 0) document.documentElement.style.zoom = z.toFixed(4);
}
window.addEventListener("resize", fit);
fit();

function render(s) {
  lastState = s;
  const w = document.getElementById("w"), se = s.session;
  const pending = se.pending > 0;

  let icon, name, sub;
  if (s.medal) {
    w.style.setProperty("--tier", TIER_COLORS[s.medal.index]);
    icon = `<div style="justify-self:center">${medalHTML(s.medal, 58)}</div>`;
    name = esc(s.medal.name);
    const tilt = s.streak && s.streak.kind === "loss" && s.streak.count >= 3;
    sub = pending ? '<span class="est">Откройте «Историю»</span>'
        : tilt ? `<span class="loss">${s.streak.count} ${plural(s.streak.count, "поражение", "поражения", "поражений")} подряд</span>`
        : `Рейтинг <span class="num">${s.rating.value.toLocaleString("ru-RU")}</span>`;
  } else {
    w.style.removeProperty("--tier");
    icon = '<div class="ph" aria-hidden="true">?</div>';
    name = "Нет рейтинга";
    sub = '<span class="est">Откройте «Историю»</span>';
  }

  // Счёт и изменение видны всегда: в начале сессии это 0–0 и +0.
  const total = se.delta + se.estimate;
  const deltaV = pending ? `<span class="est">≈${sign(total)}</span>`
                         : `<span class="${se.delta ? tone(se.delta) : "muted"}">${se.delta < 0 ? sign(se.delta) : "+" + se.delta}</span>`;
  const score = `<span class="${se.wins ? "win" : "muted"}">${se.wins}</span><span class="dash">–</span><span class="${se.losses ? "loss" : "muted"}">${se.losses}</span>`;

  w.className = "w" + (pending || !s.rating ? " wait" : "");
  w.innerHTML = `${icon}
    <div class="info"><div class="name">${name}</div><div class="sub">${sub}</div></div>
    <div class="stat score"><div class="v">${score}</div><div class="k">счёт</div></div>
    <div class="stat delta"><div class="v">${deltaV}</div><div class="k">за сессию</div></div>`;
}
function onMedalIconsBroken() { if (lastState) render(lastState); }

async function tick() {
  try {
    const s = await pywebview.api.get_state();
    const json = JSON.stringify([s.rating, s.medal, s.session.wins, s.session.losses, s.session.delta, s.session.estimate, s.session.pending, s.streak]);
    if (json !== last) { last = json; render(s); }
  } catch (e) { console.error(e); }
}

document.addEventListener("dblclick", () => pywebview.api.show_main());
let started = false;
function init() {
  if (started) return;
  started = true;
  tick();
  setInterval(tick, 1500);
}
window.addEventListener("pywebviewready", init);
if (window.pywebview && window.pywebview.api) init();
</script>
</body>
</html>
