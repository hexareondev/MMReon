<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MMReon · виджет</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { height: 100%; overflow: hidden; user-select: none; }
  .w { height: 100%; display: flex; align-items: center; gap: 12px; padding: 0 14px;
       border: 1px solid #2E3440; border-radius: 12px; background: var(--bg); }
  .w.wait { border-color: var(--est-line); }
  .badge { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
           background: #262B35; border: 2px solid var(--accent); font-weight: 800; font-size: 13px; color: var(--est); }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .mono { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 4px; }
  .sub { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .val { font-family: var(--mono); font-weight: 700; font-size: 20px; }
</style>
</head>
<body>
<div class="w" id="w" title="Двойной клик — открыть MMReon">
  <div class="badge" aria-hidden="true">—</div>
  <div class="info"><div class="name">MMReon</div><div class="sub">Загрузка…</div></div>
</div>
<script>
const sign = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";
const cls = n => n > 0 ? "win" : n < 0 ? "loss" : "muted";
const SHORT = {"Рекрут":"Р","Страж":"С","Рыцарь":"Ры","Герой":"Г","Легенда":"Л","Властелин":"В","Божество":"Б","Титан":"Т"};
let last = "";

function render(s) {
  const w = document.getElementById("w");
  const se = s.session;
  let badge = "—", name = "Рейтинг не прочитан", mmr = "";
  if (s.medal) {
    const [title, star] = s.medal.name.split(" ");
    badge = (SHORT[title] || title[0]) + (star || "");
    name = s.medal.name;
    mmr = s.rating.value.toLocaleString("ru-RU");
  }
  const pending = se.pending > 0;
  const val = pending
    ? `<div class="val est">≈ ${sign(se.delta + se.estimate)}</div>`
    : `<div class="val ${cls(se.delta)}">${sign(se.delta)}</div>`;
  const sub = s.rating
    ? (pending ? '<span class="est">Откройте «Историю»</span>'
               : `Сессия: <span class="win">${se.wins}</span> – <span class="loss">${se.losses}</span>`)
    : '<span class="est">Откройте «Профиль → История»</span>';
  w.className = "w" + (pending || !s.rating ? " wait" : "");
  w.innerHTML = `<div class="badge" aria-hidden="true">${badge}</div>
    <div class="info"><div class="name">${name}${mmr ? `<span class="mono">${mmr}</span>` : ""}</div><div class="sub">${sub}</div></div>
    ${s.rating ? val : ""}`;
}

async function tick() {
  try {
    const s = await pywebview.api.get_state();
    const json = JSON.stringify([s.rating, s.medal, s.session]);
    if (json !== last) { last = json; render(s); }
  } catch (e) { console.error(e); }
}

document.addEventListener("dblclick", () => pywebview.api.show_main());
let started = false;
function init() {
  if (started) return;
  started = true;
  tick();
  setInterval(tick, 1500);
}
window.addEventListener("pywebviewready", init);
if (window.pywebview && window.pywebview.api) init();
</script>
</body>
</html>
