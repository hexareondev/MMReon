<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MMReon</title>
<link rel="stylesheet" href="common.css">
<script src="ranks.js"></script>
<style>
  body { min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(201,163,106,.07), transparent 60%),
      var(--night); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 18px 26px 26px; display: flex; flex-direction: column; gap: 16px; }

  /* Полоса заголовка */

  /* Шапка: медаль, рейтинг, арт последнего героя */
  .hero { position: relative; overflow: hidden; border-radius: 22px; min-height: 210px;
    background: linear-gradient(180deg, #1D2230, #171A23); border: 1px solid var(--seam);
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 28px; padding: 26px 30px; }
  .hero::before { content: ""; position: absolute; inset: 0 0 0 auto; width: 62%; background: var(--art, none) right center / cover no-repeat;
    opacity: .38; filter: saturate(.85);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 55%); mask-image: linear-gradient(90deg, transparent, #000 55%); }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(23,26,35,.96) 30%, rgba(23,26,35,.55) 70%, rgba(23,26,35,.75)); }
  .hero > * { position: relative; z-index: 1; }
  .rating-label { font-size: 13px; color: var(--muted); }
  .rating { font-family: var(--display); font-stretch: condensed; font-weight: 700; font-size: 84px; line-height: .95;
    letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .rank-line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .rank-name { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--tier, var(--bronze)); }
  .rank-next { font-size: 13px; color: var(--text-2); }
  .track { position: relative; height: 8px; margin-top: 14px; max-width: 460px; border-radius: 4px; background: #2A2F3B; overflow: hidden; }
  .track > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--bronze-dim), var(--tier, var(--bronze))); }
  .rating-meta { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .status { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; align-self: start; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; font-size: 13px;
    background: rgba(18,21,28,.72); border: 1px solid var(--seam); color: var(--text-2); white-space: nowrap; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--muted)); }
  .pill.ok { --dot: var(--radiant); }
  .pill.off { --dot: #5B6070; }
  .pill.wait { --dot: var(--pending); color: var(--pending); border-color: #57461F; background: rgba(53,42,22,.85); white-space: normal; max-width: 260px; text-align: left; }

  /* Сессия и неделя */
  .duo { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; }
  .panel { background: var(--stone); border: 1px solid var(--seam); border-radius: 16px; padding: 18px 22px; min-width: 0; }
  .panel h2 { margin: 0; font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: .2px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .panel-head .muted { font-size: 13px; }
  .figure { font-family: var(--display); font-stretch: condensed; font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; }
  .session-body { display: flex; align-items: center; gap: 22px; margin-top: 12px; }
  .session-side { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .session-side .muted { font-size: 13px; }
  .chain { display: flex; gap: 6px; flex-wrap: wrap; align-content: center; flex: 1; min-width: 0; }
  .chip { position: relative; min-width: 52px; height: 44px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
  .chip.w { background: var(--radiant-deep); color: var(--radiant); }
  .chip.l { background: var(--dire-deep); color: var(--dire); }
  .chip.p { background: var(--pending-deep); color: var(--pending); outline: 1px dashed #6A5426; outline-offset: -1px; }
  .chip.u { background: var(--stone-2); color: var(--muted); font-size: 13px; font-weight: 600; }
  .chip .x2 { position: absolute; top: -6px; right: -4px; font-size: 10px; padding: 1px 4px; border-radius: 4px;
    background: var(--x2-deep); color: var(--x2); border: 1px solid #4A3D72; }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

  .split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 14px; background: var(--stone-2); }
  .split .w { background: var(--radiant); }
  .split .l { background: var(--dire); }
  .split-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }

  /* График */
  .chart-wrap { position: relative; margin-top: 10px; height: 190px; }
  .chart-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .tick-label { position: absolute; left: 0; transform: translateY(-50%); font-size: 11px; color: var(--muted);
    background: var(--stone); padding: 0 6px 0 0; }
  .tick-label.medal-start { color: var(--bronze); font-weight: 600; }
  .axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* Матчи */
  .matches { padding: 18px 0 8px; }
  .matches .panel-head { padding: 0 22px 10px; }
  .row { display: grid; grid-template-columns: 4px 92px minmax(0, 1.6fr) 104px 96px 56px minmax(150px, 1fr); gap: 14px;
    align-items: center; padding: 8px 22px 8px 0; }
  .row.head { font-size: 12px; color: var(--muted); padding-top: 2px; padding-bottom: 6px; }
  .row.item { border-top: 1px solid #242936; }
  .row.item:hover { background: rgba(255,255,255,.02); }
  .edge { align-self: stretch; border-radius: 0 3px 3px 0; }
  .edge.w { background: var(--radiant); }
  .edge.l { background: var(--dire); }
  .portrait { width: 92px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--stone-2); display: grid; place-items: center;
    font-family: var(--display); font-weight: 700; color: var(--text-2); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who { min-width: 0; }
  .who .name { font-family: var(--display); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .when { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .result { font-weight: 600; }
  .kda { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--text-2); }
  .kda span { color: var(--muted); }
  .x2btn { width: 46px; height: 32px; border-radius: 8px; border: 1px dashed #3A4050; background: transparent; color: #6F7282;
    font-family: var(--display); font-weight: 700; font-size: 13px; }
  .x2btn.on { border: 1px solid #4A3D72; background: var(--x2-deep); color: var(--x2); }
  .x2btn.manual { box-shadow: inset 0 -2px 0 var(--x2); }
  .delta { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .bar { flex: 1; max-width: 110px; height: 6px; border-radius: 3px; background: #262B37; position: relative; overflow: hidden; }
  .bar > i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .bar > i.w { left: 0; background: var(--radiant); }
  .bar > i.l { left: 0; background: var(--dire); }
  .bar > i.p { left: 0; background: repeating-linear-gradient(90deg, var(--pending) 0 4px, transparent 4px 7px); }
  .dv { font-family: var(--display); font-stretch: condensed; font-weight: 700; font-size: 22px; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
  .tag.p { background: var(--pending-deep); color: var(--pending); }
  .tag.n { color: var(--muted); border: 1px solid var(--seam); }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 0 4px; }
  footer label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; color: var(--text-2); }
  footer input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--bronze); }
  .settings { display: flex; gap: 8px 28px; flex-wrap: wrap; align-items: center; }
  .opacity input { width: 140px; accent-color: var(--bronze); }
  .opacity output { min-width: 40px; color: var(--text); }

  /* Прогноз под полосой прогресса */
  .forecast { margin-top: 10px; font-size: 13px; color: var(--text-2); }
  .forecast b { color: var(--tier, var(--bronze)); font-weight: 600; }
  .forecast .sep { color: var(--seam); margin: 0 10px; }

  /* Сессия: матч из «Истории» без точного изменения */
  .chip.h { outline: 1px dashed currentColor; outline-offset: -1px; opacity: .8; font-size: 13px; }

  /* Герои */
  .heroes { margin-top: 10px; display: flex; flex-direction: column; }
  .hrow { display: grid; grid-template-columns: 64px minmax(120px, 1.3fr) 110px minmax(180px, 1.4fr) minmax(170px, 1fr);
          gap: 16px; align-items: center; padding: 8px 0; border-top: 1px solid #242936; }
  .hrow:first-child { border-top: 0; }
  .portrait.sm { width: 64px; height: 36px; border-radius: 6px; font-size: 13px; }
  .hname { font-family: var(--display); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hgames { font-size: 16px; }
  .hgames .muted { font-size: 13px; font-family: var(--sans); }
  .hwr { display: flex; align-items: center; gap: 10px; }
  .hwr .num { font-size: 15px; }
  .wr { flex: 1; max-width: 120px; height: 8px; border-radius: 4px;
        background: linear-gradient(90deg, var(--radiant) var(--w), var(--dire) var(--w)); }
  .hmmr { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .hbar { flex: 1; max-width: 120px; height: 6px; border-radius: 3px; background: #262B37; overflow: hidden; }
  .hbar i { display: block; height: 100%; border-radius: 3px; }
  .hbar i.w { background: var(--radiant); }
  .hbar i.l { background: var(--dire); }
  .more { margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--seam);
          background: var(--stone-2); color: var(--text-2); }
  .more:hover { color: var(--text); border-color: var(--bronze-dim); }

  /* Матчи: раскрываемые подробности */
  .match.open { background: rgba(201,163,106,.035); }
  button.who { border: 0; background: transparent; text-align: left; padding: 6px 0; cursor: pointer; }
  button.who:hover .name { color: var(--bronze); }
  .who .mode { margin-left: 8px; font-family: var(--sans); font-size: 11px; font-weight: 600; padding: 2px 7px;
               border-radius: 5px; color: var(--muted); border: 1px solid var(--seam); vertical-align: 2px; }
  .chev { display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-right: 1.5px solid var(--muted);
          border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .15s; }
  .match.open .chev { transform: rotate(-135deg) translateY(-1px); }
  .details { display: flex; flex-wrap: wrap; gap: 14px 34px; padding: 6px 22px 18px 110px; }
  .details .empty { padding: 0; }
  .dblock { display: flex; flex-direction: column; gap: 8px; }
  .dblock.wide { flex: 1 1 320px; }
  .dlabel { font-size: 12px; color: var(--muted); }
  .build { display: flex; gap: 4px; align-items: center; }
  .neutral-wrap { margin-left: 8px; }
  .itm { width: 50px; height: 37px; border-radius: 4px; overflow: hidden; background: #0F1218; border: 1px solid #262B37;
          display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .itm img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .itm.empty { opacity: .5; }
  .itm.neutral { width: 37px; border-radius: 50%; }
  .itm.small { width: 36px; height: 27px; }
  .backpack { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
  .backpack span { margin-left: 6px; }
  .buffs { display: flex; gap: 6px; }
  .buff { font-size: 12px; padding: 3px 8px; border-radius: 5px; border: 1px dashed var(--seam); color: #6F7282; }
  .buff.on { border: 1px solid #3B6FA8; background: #172539; color: #8CC0F2; }
  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 10px; }
  .timeline li { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
  .talents { display: flex; flex-direction: column-reverse; gap: 4px; }
  .tier { display: grid; grid-template-columns: 34px 30px 34px; align-items: center; gap: 4px; }
  .tier .num { text-align: center; font-size: 13px; color: var(--muted); }
  .tier i { height: 8px; border-radius: 4px; background: #262B37; }
  .tier i.on { background: var(--bronze); }
  .nums { margin: 0; display: grid; grid-template-columns: repeat(2, auto); gap: 8px 22px; }
  .nums dt { font-size: 12px; color: var(--muted); }
  .nums dd { margin: 2px 0 0; font-size: 16px; }

  @media (max-width: 900px) {
    .hero { grid-template-columns: auto 1fr; }
    .status { grid-column: 1 / -1; align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    .duo { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero" id="hero" aria-label="Текущий рейтинг"></section>

  <div class="duo">
    <section class="panel" id="session" aria-label="Сессия"></section>
    <section class="panel" id="week" aria-label="Последние 7 дней"></section>
  </div>

  <section class="panel">
    <div class="panel-head"><h2>Рейтинг за 30 дней</h2><span class="muted" id="chart-range"></span></div>
    <div id="chart"></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Герои</h2><span class="muted">Рейтинговые матчи, изменение рейтинга — по точным данным</span></div>
    <div id="heroes" class="heroes"></div>
    <button id="heroes-more" class="more" hidden></button>
  </section>

  <section class="panel matches">
    <div class="panel-head"><h2>Матчи</h2><span class="muted">Кнопка ×2 отмечает жетон двойного рейтинга</span></div>
    <div class="row head"><div></div><div></div><div>Герой</div><div>Итог</div><div>У / С / П</div><div>Жетон</div><div style="text-align:right">Изменение рейтинга</div></div>
    <div id="matches"></div>
  </section>

  <footer>
    <div class="settings">
      <label><input type="checkbox" id="widget-toggle"> Показывать виджет в главном меню Доты</label>
      <label title="Виджет встаёт поверх панели профиля и не мешает кликать по Доте. Если выключить, его можно перетаскивать мышью, а двойной клик откроет это окно.">
        <input type="checkbox" id="widget-anchor"> Закрепить на панели профиля</label>
      <label class="opacity" for="widget-opacity">Непрозрачность виджета
        <input type="range" id="widget-opacity" min="30" max="100" step="5" value="100">
        <output id="widget-opacity-value" class="num">100%</output></label>
    </div>
    <span>Сверните окно, чтобы трекер работал в фоне. Крестик закрывает MMReon.</span>
  </footer>
</div>

<script>
let lastJson = "", lastState = null, heroDrawn = "";

const dur = s => s == null ? "" : (s >= 3600 ? Math.floor(s / 3600) + ":" + pad(Math.floor(s % 3600 / 60)) : Math.floor(s / 60)) + ":" + pad(s % 60);
function when(iso) {
  const d = new Date(iso), now = new Date();
  const t = pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (d.toDateString() === now.toDateString()) return "сегодня, " + t;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "вчера, " + t;
  return d.toLocaleDateString("ru-RU", {day: "numeric", month: "long"}) + ", " + t;
}
const initials = name => name.split(/[\s-]+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
function portrait(m, cls = "portrait") {
  if (!m.hero_code) return `<div class="${cls}">?</div>`;
  return `<div class="${cls}"><img src="${HEROES_URL}${esc(m.hero_code)}.png" alt="" onerror="this.parentNode.textContent='${esc(initials(m.hero))}'"></div>`;
}

function renderHero(s) {
  const el = document.getElementById("hero");
  const st = s.status;
  const pills = [];
  pills.push(st.gsi ? '<div class="pill ok">Связь с Дотой есть</div>' : '<div class="pill off">Дота не отвечает</div>');
  if (st.dota_running) pills.push(st.in_match ? '<div class="pill ok">Идёт матч</div>' : '<div class="pill ok">Главное меню</div>');
  if (st.waiting_history && !st.in_match)
    pills.push(`<div class="pill wait">${st.has_rating ? "Откройте «Профиль → История», чтобы записать точное изменение" : "Откройте «Профиль → История», чтобы запомнить исходный рейтинг"}</div>`);
  const status = `<div class="status" aria-live="polite">${pills.join("")}</div>`;
  el.style.setProperty("--art", s.last_hero ? `url("${HEROES_URL}${s.last_hero}.png")` : "none");

  if (!s.rating) {
    el.innerHTML = `<div class="medal" style="width:132px;height:132px;--tier:var(--bronze)"><div class="fallback" style="font-size:40px">?</div></div>
      <div><div class="rating-label">Рейтинг</div><div class="rating muted">—</div>
      <div class="rating-meta">Трекер прочитает рейтинг, как только вы откроете в Доте «Профиль → История»</div></div>${status}`;
    return;
  }
  const m = s.medal, r = s.rating;
  const tier = TIER_COLORS[m.index];
  el.style.setProperty("--tier", tier);
  const next = m.to_next != null ? `ещё ${m.to_next} до звания ${esc(m.next_name)}` : "высшее звание";
  const fresh = heroDrawn !== r.value + m.name ? " fresh" : "";
  heroDrawn = r.value + m.name;
  el.innerHTML = `
    ${medalHTML(m, 132).replace('class="medal"', 'class="medal' + fresh + '"')}
    <div>
      <div class="rating-label">Рейтинг</div>
      <div class="rating">${r.value.toLocaleString("ru-RU")}</div>
      <div class="rank-line"><span class="rank-name">${esc(m.name)}</span><span class="rank-next">${next}</span></div>
      <div class="track" role="img" aria-label="Прогресс до следующей звезды: ${Math.round(m.progress * 100)}%"><div style="width:${Math.max(3, Math.round(m.progress * 100))}%"></div></div>
      ${forecastHTML(s.forecast, m)}
      <div class="rating-meta">
        ${r.confidence != null ? `<span>Уверенность в ранге ${r.confidence}%</span>` : ""}
        <span>Обновлено ${when(r.read_at)}</span>
      </div>
    </div>
    ${status}`;
}

function forecastHTML(f, m) {
  if (!f) return "";
  const wins = n => `${n} ${plural(n, "победа", "победы", "побед")}`;
  const parts = [`<b>≈${wins(f.wins_to_star)}</b> до звания ${esc(m.next_name)}`];
  if (f.wins_to_medal && !m.next_name.startsWith(m.next_medal)) parts.push(`≈${wins(f.wins_to_medal)} до медали ${esc(m.next_medal)}`);
  return `<div class="forecast" title="Расчёт по средней победе без жетона: +${f.per_win}">${parts.join("<span class='sep'>/</span>")}</div>`;
}

function chipHTML(m) {
  const x2 = m.double ? '<span class="x2">×2</span>' : "";
  const title = `${esc(m.hero)}, ${m.won ? "победа" : "поражение"}`;
  const wl = m.won ? "П" : "Пр";
  if (m.status === "exact") return `<div class="chip ${m.delta >= 0 ? "w" : "l"}" title="${title}">${sign(m.delta)}${x2}</div>`;
  if (m.status === "pending") return `<div class="chip p" title="${title}, ждёт «Истории»">≈${sign(m.estimate)}${x2}</div>`;
  if (m.status === "group") return `<div class="chip ${m.won ? "w" : "l"}" title="${title}, известна только сумма">${wl}${x2}</div>`;
  if (m.status === "history" && m.mode === "ranked")
    return `<div class="chip ${m.won ? "w" : "l"} h" title="${title}, из «Истории», без точного изменения">${wl}</div>`;
  return `<div class="chip u" title="${title}, ${m.mode_label || "без рейтинга"}">${wl}</div>`;
}

function renderSession(s) {
  const se = s.session, el = document.getElementById("session");
  if (!se.items.length) {
    el.innerHTML = `<div class="panel-head"><h2>Сессия</h2></div>
      <div class="empty" style="margin-top:12px">Новая сессия начнётся с первого матча. Перерыв больше трёх часов закрывает сессию.</div>`;
    return;
  }
  const total = se.delta + se.estimate;
  const figure = se.pending ? `<div class="figure est">≈${sign(total)}</div>` : `<div class="figure ${tone(se.delta)}">${sign(se.delta)}</div>`;
  const record = `<span class="win">${se.wins} ${plural(se.wins, "победа", "победы", "побед")}</span>, <span class="loss">${se.losses} ${plural(se.losses, "поражение", "поражения", "поражений")}</span>`;
  const extra = se.pending ? `<div class="est" style="font-size:13px">Ждёт «Истории»: ${se.pending}</div>` : "";
  el.innerHTML = `
    <div class="panel-head"><h2>Сессия</h2><span class="muted">с ${new Date(se.started_at).toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})}</span></div>
    <div class="session-body">
      <div class="session-side">${figure}<div class="muted">${record}</div>${extra}</div>
      <div class="chain" aria-label="Матчи сессии по порядку">${se.items.map(chipHTML).join("")}</div>
    </div>`;
}

function renderWeek(s) {
  const w = s.week, el = document.getElementById("week");
  const figure = w.delta == null ? '<div class="figure muted">—</div>' : `<div class="figure ${tone(w.delta)}">${sign(w.delta)}</div>`;
  let split = "";
  if (w.matches) {
    const wins = Math.round(w.matches * w.winrate / 100), losses = w.matches - wins;
    split = `<div class="split" role="img" aria-label="Побед ${wins}, поражений ${losses}">
        <div class="w" style="width:${w.winrate}%"></div><div class="l" style="width:${100 - w.winrate}%"></div></div>
      <div class="split-legend"><span class="win">${wins} ${plural(wins, "победа", "победы", "побед")}</span><span class="muted">винрейт ${w.winrate}%</span><span class="loss">${losses} ${plural(losses, "поражение", "поражения", "поражений")}</span></div>`;
  } else {
    split = '<div class="empty" style="margin-top:14px">За неделю рейтинговых матчей нет</div>';
  }
  el.innerHTML = `<div class="panel-head"><h2>7 дней</h2><span class="muted">${w.matches} ${plural(w.matches, "матч", "матча", "матчей")}</span></div>
    <div style="margin-top:12px">${figure}</div>${split}`;
}

function renderChart(points) {
  const box = document.getElementById("chart"), range = document.getElementById("chart-range");
  if (points.length < 2) {
    box.innerHTML = '<div class="empty" style="padding:30px 0">График появится после первых матчей с точным изменением рейтинга</div>';
    range.textContent = "";
    return;
  }
  const W = Math.max(box.clientWidth, 300), H = 190, padL = 92, padR = 8, padT = 10, padB = 10;
  const t = points.map(p => new Date(p.at).getTime()), v = points.map(p => p.value);
  const t0 = Math.min(...t), t1 = Math.max(Date.now(), ...t);
  // Не меньше ~160 MMR по высоте, чтобы были видны соседние звёзды.
  const vmin = Math.min(...v), vmax = Math.max(...v);
  const extra = Math.max(20, (160 - (vmax - vmin)) / 2);
  const lo = vmin - extra, hi = vmax + extra;
  const X = x => padL + ((x - t0) / Math.max(t1 - t0, 1)) * (W - padL - padR);
  const Y = y => padT + (1 - (y - lo) / (hi - lo)) * (H - padT - padB);

  // Границы звёзд: 154 MMR (у Божества 160), начала медалей подписаны бронзой.
  const ticks = [];
  for (let idx = 0; idx < 7; idx++) {
    const step = idx === 6 ? 160 : 154;
    for (let k = 0; k < 5; k++) {
      const at = idx * 770 + k * step;
      if (at > lo && at < hi) ticks.push({at, label: `${MEDAL_NAMES[idx]} ${k + 1}`, start: k === 0});
    }
  }
  let d = "";
  points.forEach((p, i) => { d += i === 0 ? `M${X(t[i]).toFixed(1)},${Y(v[i]).toFixed(1)}` : `H${X(t[i]).toFixed(1)}V${Y(v[i]).toFixed(1)}`; });
  d += `H${X(t1).toFixed(1)}`;
  const area = `${d}V${H - padB}H${X(t0).toFixed(1)}Z`;
  const lines = ticks.map(tk => `<line x1="${padL}" x2="${W - padR}" y1="${Y(tk.at).toFixed(1)}" y2="${Y(tk.at).toFixed(1)}"
      stroke="${tk.start ? "#7A6544" : "#2C3240"}" stroke-dasharray="${tk.start ? "0" : "3 5"}"/>`).join("");
  const dots = points.slice(1).map((p, i) => {
    const up = p.value >= points[i].value;
    return `<circle cx="${X(t[i + 1]).toFixed(1)}" cy="${Y(p.value).toFixed(1)}" r="3.5" fill="${up ? "#6FCF8E" : "#E8664A"}" stroke="#1A1E27" stroke-width="2"/>`;
  }).join("");
  const labels = ticks.map(tk => `<span class="tick-label${tk.start ? " medal-start" : ""}" style="top:${Y(tk.at).toFixed(1)}px">${tk.label}</span>`).join("");
  const last = v[v.length - 1];
  box.innerHTML = `<div class="chart-wrap" role="img" aria-label="Рейтинг за 30 дней: от ${v[0]} до ${last}">
      <svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#C9A36A" stop-opacity=".28"/><stop offset="1" stop-color="#C9A36A" stop-opacity="0"/></linearGradient></defs>
        ${lines}<path d="${area}" fill="url(#fill)"/>
        <path d="${d}" fill="none" stroke="#C9A36A" stroke-width="2.5" stroke-linejoin="round"/>${dots}
      </svg>${labels}</div>
    <div class="axis" style="padding-left:${padL}px"><span>${when(points[0].at)}</span><span>сейчас</span></div>`;
  range.textContent = `от ${Math.min(...v)} до ${Math.max(...v)}`;
}

function deltaCell(m) {
  const scale = x => Math.min(100, Math.round(Math.abs(x) / 70 * 100));
  if (m.status === "exact")
    return `<div class="bar" aria-hidden="true"><i class="${m.delta >= 0 ? "w" : "l"}" style="width:${scale(m.delta)}%"></i></div><span class="dv ${tone(m.delta)}">${sign(m.delta)}</span>`;
  if (m.status === "pending")
    return `<span class="tag p">ждёт «Истории»</span><span class="dv est">≈${sign(m.estimate)}</span>`;
  if (m.status === "group")
    return `<span class="tag n" title="Несколько матчей подряд без открытия «Истории»">сумма нескольких матчей</span><span class="dv ${tone(m.group_delta)}">${sign(m.group_delta)}</span>`;
  if (m.status === "unrated") return `<span class="tag n">без рейтинга</span>`;
  if (m.status === "history")
    return `<span class="tag n" title="Матч сыгран, когда трекер не работал. Точное изменение рейтинга неизвестно.">из «Истории»</span>`;
  return "";
}

const ITEMS_URL = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items/";
const itemName = code => code.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const clock = t => `${Math.floor(t / 60)}:${pad(Math.floor(t % 60))}`;
function itemIcon(code, cls = "itm") {
  if (!code) return `<div class="${cls} empty"></div>`;
  return `<div class="${cls}" title="${esc(itemName(code))}"><img src="${ITEMS_URL}${esc(code)}.png" alt="${esc(itemName(code))}"
    onerror="this.parentNode.classList.add('noimg');this.parentNode.textContent='${esc(itemName(code)).slice(0, 3)}'"></div>`;
}

function detailsHTML(m) {
  const d = m.details || {};
  const blocks = [];
  if (d.items) {
    const extras = [];
    if (d.scepter != null) extras.push(`<span class="buff ${d.scepter ? "on" : ""}">Аганим</span>`);
    if (d.shard != null) extras.push(`<span class="buff ${d.shard ? "on" : ""}">Шард</span>`);
    blocks.push(`<div class="dblock"><div class="dlabel">Предметы в конце матча</div>
      <div class="build">${d.items.map(i => itemIcon(i)).join("")}<div class="neutral-wrap">${itemIcon(d.neutral, "itm neutral")}</div></div>
      ${d.backpack && d.backpack.some(Boolean) ? `<div class="backpack">${d.backpack.map(i => itemIcon(i, "itm small")).join("")}<span>рюкзак</span></div>` : ""}
      ${extras.length ? `<div class="buffs">${extras.join("")}</div>` : ""}</div>`);
  }
  if (d.item_timings && d.item_timings.length) {
    blocks.push(`<div class="dblock wide"><div class="dlabel">Когда собраны предметы</div>
      <ol class="timeline">${d.item_timings.map(t => `<li>${itemIcon(t.item, "itm small")}<span class="num">${clock(t.t)}</span></li>`).join("")}</ol></div>`);
  }
  if (d.talents) {
    const tiers = [10, 15, 20, 25].map((lvl, i) => {
      const a = d.talents[i * 2], b = d.talents[i * 2 + 1];
      return `<div class="tier"><i class="${a ? "on" : ""}"></i><span class="num">${lvl}</span><i class="${b ? "on" : ""}"></i></div>`;
    }).join("");
    blocks.push(`<div class="dblock"><div class="dlabel">Таланты</div><div class="talents">${tiers}</div></div>`);
  }
  const nums = [];
  if (d.level != null) nums.push(["Уровень", d.level]);
  if (d.gpm != null) nums.push(["GPM / XPM", `${d.gpm} / ${d.xpm ?? "—"}`]);
  if (d.last_hits != null) nums.push(["Добивания", `${d.last_hits} / ${d.denies ?? 0}`]);
  if (d.lh10 != null) nums.push(["Добивания к 10:00", d.lh10]);
  if (d.rating_before != null) nums.push(["Рейтинг", `${d.rating_before} → ${d.rating_after}`]);
  if (m.mode_label) nums.push(["Тип игры", m.mode_label]);
  if (nums.length) blocks.push(`<div class="dblock"><dl class="nums">${nums.map(([k, v]) => `<div><dt>${k}</dt><dd class="num">${esc(v)}</dd></div>`).join("")}</dl></div>`);
  if (!blocks.length) return `<div class="details"><div class="empty">Подробностей нет: матч взят из «Истории» Доты.</div></div>`;
  return `<div class="details">${blocks.join("")}</div>`;
}

const openRows = new Set();
function renderMatches(list) {
  const box = document.getElementById("matches");
  if (!list.length) {
    box.innerHTML = '<div class="empty" style="padding:18px 22px">Сыграйте матч: он появится здесь сразу после падения трона.</div>';
    return;
  }
  box.innerHTML = list.map(m => {
    const res = m.won ? "w" : "l";
    const x2title = m.double_manual === null ? (m.double ? "Определено автоматически. Нажмите, чтобы изменить" : "Нажмите, если применяли жетон")
                                             : "Отмечено вручную. Нажмите, чтобы изменить";
    const x2 = (m.status === "unrated" || m.status === "history") ? "" :
      `<button class="x2btn ${m.double ? "on" : ""} ${m.double_manual !== null ? "manual" : ""}" data-id="${esc(m.id)}"
         aria-pressed="${m.double}" title="${x2title}" aria-label="Жетон двойного рейтинга">×2</button>`;
    const kda = m.kda ? (([k, de, a]) => `${k}<span> / </span>${de}<span> / </span>${a}`)(m.kda.split("/")) : '<span>—</span>';
    const mode = m.mode && m.mode !== "ranked" ? `<span class="mode">${esc(m.mode_label)}</span>` : "";
    const open = openRows.has(m.id);
    return `<div class="match ${open ? "open" : ""}">
      <div class="row item">
        <div class="edge ${res}"></div>
        ${portrait(m)}
        <button class="who" data-open="${esc(m.id)}" aria-expanded="${open}" title="Подробности матча">
          <div class="name">${esc(m.hero)}${mode}</div>
          <div class="when">${when(m.started_at || m.ended_at)}${m.duration_sec != null ? ", " + dur(m.duration_sec) : ""}<span class="chev" aria-hidden="true"></span></div>
        </button>
        <div class="result ${m.won ? "win" : "loss"}">${m.won ? "Победа" : "Поражение"}</div>
        <div class="kda">${kda}</div>
        <div>${x2}</div>
        <div class="delta">${deltaCell(m)}</div>
      </div>
      ${open ? detailsHTML(m) : ""}
    </div>`;
  }).join("");
}

let heroesAll = false;
function renderHeroes(list) {
  const box = document.getElementById("heroes"), more = document.getElementById("heroes-more");
  if (!list.length) {
    box.innerHTML = '<div class="empty">Статистика появится после первых рейтинговых матчей.</div>';
    more.hidden = true;
    return;
  }
  const shown = heroesAll ? list : list.slice(0, 6);
  const maxMmr = Math.max(30, ...list.map(h => Math.abs(h.mmr)));
  box.innerHTML = shown.map(h => {
    const mmr = h.mmr_games
      ? `<div class="hbar" aria-hidden="true"><i class="${h.mmr >= 0 ? "w" : "l"}" style="width:${Math.round(Math.abs(h.mmr) / maxMmr * 100)}%"></i></div>
         <span class="dv ${tone(h.mmr)}">${sign(h.mmr)}</span>`
      : '<span class="muted" style="font-size:13px">нет точных данных</span>';
    return `<div class="hrow">
      ${portrait({hero: h.name, hero_code: h.code}, "portrait sm")}
      <div class="hname">${esc(h.name)}</div>
      <div class="hgames num">${h.games}<span class="muted"> ${plural(h.games, "матч", "матча", "матчей")}</span></div>
      <div class="hwr"><div class="wr" style="--w:${h.winrate}%" role="img" aria-label="Побед ${h.wins}, поражений ${h.losses}"></div>
        <span class="num ${h.winrate >= 50 ? "win" : "loss"}">${h.winrate}%</span><span class="muted num">${h.wins}–${h.losses}</span></div>
      <div class="hmmr">${mmr}</div>
    </div>`;
  }).join("");
  more.hidden = list.length <= 6;
  more.textContent = heroesAll ? "Свернуть" : `Все герои (${list.length})`;
}

function render(s) {
  lastState = s;
  renderHero(s);
  renderSession(s);
  renderWeek(s);
  renderChart(s.chart);
  renderHeroes(s.heroes);
  renderMatches(s.matches);
}
function onMedalIconsBroken() { if (lastState) render(lastState); }

async function tick() {
  try {
    const s = await pywebview.api.get_state();
    const json = JSON.stringify(s);
    if (json !== lastJson) { lastJson = json; render(s); }
  } catch (e) { console.error(e); }
}

document.getElementById("matches").addEventListener("click", async e => {
  const opener = e.target.closest("[data-open]");
  if (opener) {
    const id = opener.dataset.open;
    openRows.has(id) ? openRows.delete(id) : openRows.add(id);
    if (lastState) renderMatches(lastState.matches);
    return;
  }
  const b = e.target.closest(".x2btn");
  if (!b) return;
  await pywebview.api.toggle_double(b.dataset.id);
  tick();
});
document.getElementById("heroes-more").addEventListener("click", () => {
  heroesAll = !heroesAll;
  if (lastState) renderHeroes(lastState.heroes);
});
const opacity = document.getElementById("widget-opacity"), opacityOut = document.getElementById("widget-opacity-value");
opacity.addEventListener("input", () => {
  opacityOut.textContent = opacity.value + "%";
  pywebview.api.set_widget_opacity(opacity.value / 100);
});
document.getElementById("widget-anchor").addEventListener("change", e => pywebview.api.set_widget_anchor(e.target.checked));
document.getElementById("widget-toggle").addEventListener("change", e => pywebview.api.set_widget_enabled(e.target.checked));
window.addEventListener("resize", () => { if (lastState) renderChart(lastState.chart); });

let started = false;
async function init() {
  if (started) return;
  started = true;
  const cfg = await pywebview.api.get_settings();
  document.getElementById("widget-toggle").checked = cfg.widget_enabled;
  document.getElementById("widget-anchor").checked = cfg.widget_anchor;
  opacity.value = Math.round(cfg.widget_opacity * 100);
  opacityOut.textContent = opacity.value + "%";
  tick();
  setInterval(tick, 1000);
}
window.addEventListener("pywebviewready", init);
if (window.pywebview && window.pywebview.api) init();
</script>
</body>
</html>
